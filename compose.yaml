services:
  mysql:
    image: mysql:8.4
    container_name: biblioteca-gof-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootlocal
      MYSQL_DATABASE: biblioteca_gof
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca
    ports:
      - "3307:3306"
    volumes:
      - mysql_biblioteca:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_biblioteca:
